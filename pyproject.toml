[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-robot-abstract-machine"
description = "Meta-package that wires local subprojects together"
requires-python = ">=3.12,<3.13"
license = "LGPL-3.0-only"
dynamic = ["version"]
readme = "README.md"
authors = [{ name = "AICOR Institute", email = "you@example.com" }]

# Add dependencies on all workspace members by their distribution names
# uv will resolve these to editable installs via [tool.uv.sources]
dependencies = [
  "coraplex>=26.11.0",
  "giskardpy>=26.11.0",
  "cramph>=26.11.0",
  "semantic_digital_twin>=26.11.0",
  "krrood>=26.11.0",
  "random-events>=26.11.0",
  "probabilistic_model>=26.11.0",
  "robokudo>=26.11.0",
  "physics_simulators>=26.11.0",
  "experiments>=26.11.0",
  "segmind>=26.11.0",
  "krrood_spatial_math>=26.11.0",
  "krrood_compute_resources>=26.11.0",
  "krrood_synchronization>=26.11.0",
  "ipykernel>=7.2.0",
  "lark-parser>=0.12.0",
  "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-xdist",
    "pytest-rerunfailures",
    "pytest-cov",
    "setuptools>=68",
    "wheel",
    "treon",
    "bokeh",
    "mypy>=1.8",
    "krrood-development-tools>=26.11.0",
]

doc = [
    "jupyter-book<2.0.0",
    "jupyter",
    "ghp-import",
    "nbconvert",
    "jupytext",
    "jupyterquiz",
    "sphinx-autoapi",
    "sphinx-proof",
    "sphinxcontrib-plantuml",
    "sphinxcontrib-mermaid",
    "Pygments>=2.15.0",
    "pylint",
    "matplotlib",
    "numpy",
    "scipy",
    "pillow",
    "graphviz",
    "polytope",
    "ortools",
    "cvxopt",
    "treon",
    "jupytext",
]

[tool.uv]
# make treon require docopt-ng instead of the unmaintained docopt
override-dependencies = [
    { package = { name = "treon" }, dependencies = ["docopt-ng"] },
]
exclude-dependencies = [
    { package = { name = "treon" }, dependencies = ["docopt"] },
    "pathlib",
]

[tool.uv.workspace]
members = [
  "coraplex",
  "giskardpy",
  "cramph",
  "semantic_digital_twin",
  "krrood",
  "krrood/krrood-core",
  "krrood/krrood-serialization",
  "krrood/krrood-code-generation",
  "krrood/krrood-symbolic-math",
  "krrood/krrood-rustworkx-utils",
  "krrood/krrood-eql",
  "krrood/krrood-planning",
  "krrood/krrood-ormatic",
  "krrood/krrood-probabilistic",
  "krrood/krrood-rdr",
  "krrood/krrood-ontomatic",
  "krrood/krrood-development-tools",
  "random_events",
  "probabilistic_model",
  "physics_simulators",
  "robokudo",
  "experiments",
  "segmind",
  "domain_models/krrood_spatial_math",
  "domain_models/krrood_compute_resources",
  "domain_models/krrood_synchronization"
]

[tool.uv.sources]
coraplex       = { workspace = true }
giskardpy             = { workspace = true }
cramph                = { workspace = true }
semantic_digital_twin = { workspace = true }
krrood                = { workspace = true }
krrood-core = { workspace = true }
krrood-serialization = { workspace = true }
krrood-code-generation = { workspace = true }
krrood-symbolic-math = { workspace = true }
krrood-rustworkx-utils = { workspace = true }
krrood-eql = { workspace = true }
krrood-planning = { workspace = true }
krrood-ormatic = { workspace = true }
krrood-probabilistic = { workspace = true }
krrood-rdr = { workspace = true }
krrood-ontomatic = { workspace = true }
krrood-development-tools = { workspace = true }
probabilistic_model   = { workspace = true }
random_events         = { workspace = true }
robokudo              = { workspace = true }
physics_simulators    = { workspace = true }
segmind               = { workspace = true }
experiments           = { workspace = true }
krrood_spatial_math   = { workspace = true }
krrood_compute_resources = { workspace = true }
krrood_synchronization = { workspace = true }

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
coraplex = { path = "coraplex", develop = true }
giskardpy = { path = "giskardpy", develop = true }
cramph = { path = "cramph", develop = true }
semantic_digital_twin = { path = "semantic_digital_twin", develop = true }
krrood = { path = "krrood", develop = true }
krrood-core = { path = "krrood/krrood-core", develop = true }
krrood-serialization = { path = "krrood/krrood-serialization", develop = true }
krrood-code-generation = { path = "krrood/krrood-code-generation", develop = true }
krrood-symbolic-math = { path = "krrood/krrood-symbolic-math", develop = true }
krrood-rustworkx-utils = { path = "krrood/krrood-rustworkx-utils", develop = true }
krrood-eql = { path = "krrood/krrood-eql", develop = true }
krrood-planning = { path = "krrood/krrood-planning", develop = true }
krrood-ormatic = { path = "krrood/krrood-ormatic", develop = true }
krrood-probabilistic = { path = "krrood/krrood-probabilistic", develop = true }
krrood-rdr = { path = "krrood/krrood-rdr", develop = true }
krrood-ontomatic = { path = "krrood/krrood-ontomatic", develop = true }
krrood-development-tools = { path = "krrood/krrood-development-tools", develop = true }
random_events = { path = "random_events", develop = true }
probabilistic_model = { path = "probabilistic_model", develop = true }
robokudo = { path = "robokudo", develop = true }
physics_simulators = { path = "physics_simulators", develop = true }
experiments = { path = "experiments", develop = true }
segmind = { path = "segmind", develop = true }
krrood_spatial_math = { path = "domain_models/krrood_spatial_math", develop = true }
krrood_compute_resources = { path = "domain_models/krrood_compute_resources", develop = true }
krrood_synchronization = { path = "domain_models/krrood_synchronization", develop = true }

[tool.setuptools]
packages = ["cognitive_robot_abstract_machine"]
package-dir = {"" = "."}

[tool.setuptools.dynamic]
version = {attr = "cognitive_robot_abstract_machine._version.__version__"}

# The files `krrood check` leaves alone, wherever it runs: pre-commit or CI.
[tool.krrood.check]
exclude = [
    # generated by ORMatic, never written by hand
    '(^|/)ormatic_interface\.py$',
    # generated by scripts/sync_version.py, never written by hand
    '(^|/)_version\.py$',
    # the inputs of krrood's checker tests, which break the rules on purpose
    '^test/krrood_test/test_development_tools/dataset/',
    # the input of the ORM interface import check's tests, which breaks it on purpose
    '^test/cognitive_robot_abstract_machine_test/dataset/orm_interface_imports/',
    # the ripple down rules expert answers, left unchecked for now
    '^test/krrood_test/test_ripple_down_rules/test_expert_answers/',
    # the tests, left unchecked
    '^test/',
]
