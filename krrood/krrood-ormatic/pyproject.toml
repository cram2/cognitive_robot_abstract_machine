[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "krrood-ormatic"
dynamic = ["version"]
description = "ORMatic: SQLAlchemy interfaces generated from dataclasses, queried with EQL."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]
authors = [
    {name = "Tom Schierenbeck", email = "tom_sch@uni-bremen.de"}
]
dependencies = [
    "krrood-core==26.10.0",
    "krrood-serialization==26.10.0",
    "krrood-code-generation==26.10.0",
    "krrood-eql==26.10.0",
    "sqlalchemy",
    "numpy",
    "rustworkx>=0.14.0",
    "sortedcontainers",
]

[project.urls]
Homepage = "https://cram2.github.io/cognitive_robot_abstract_machine/krrood/intro.html"
"Source" = "https://github.com/cram2/cognitive_robot_abstract_machine"
"Bug Tracker" = "https://github.com/cram2/cognitive_robot_abstract_machine/issues"
"Changelog" = "https://github.com/cram2/cognitive_robot_abstract_machine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["krrood*"]

[tool.setuptools.package-data]
"*" = ["templates/*.jinja", "visualization/templates/*.jinja"]

[tool.setuptools.dynamic]
version = {attr = "krrood.ormatic._version.__version__"}
