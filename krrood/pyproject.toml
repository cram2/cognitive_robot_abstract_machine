[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[project]
name = "krrood"
dynamic = ["version"]
dependencies = [
    "rdflib",
    "jinja2",
    "inflect",
    "lemminflect",
    "owlrl",
    "typing-extensions>=4.12.2",
    "rustworkx>=0.14.0",
    "sqlalchemy",
    "black",
    "ruff",
    "sortedcontainers",
    "inflection",
    "anytree>=2.8.0",
    "ordered_set>=4",
    "pygraphviz>=1.7",
    "graphviz",
    "tabulate",
    "ipython",
    "requests",
    "colorama",
    "tqdm",
    "pygments",
    "pandas",
    "pyparsing>=3.2.3",
    "omegaconf",
    "pydot",
    "ucimlrepo>=0.0.7",
    "pdbpp",
    "pytest",
    "probabilistic_model>=26.10.0",
    "random_events>=26.10.0",
]
description = "A python package for Knowledge Representation and Reasoning systems based on Object Oriented Design."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
authors = [
    {name = "Abdelrhman Bassiouny", email = "abassiou@uni-bremen.de"},
    {name = "Tom Schierenbeck", email = "tom_sch@uni-bremen.de"}
]
keywords = ["Knowledge-representation", "reasoning", "ontology", "orm", "query-langauge", "database", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "mypy>=1.8",
    "matplotlib",
    "igraph",
    "pyyaml",
]
visualization = [
    "dash",
    "plotly",
    "flask",
]
# The formatter's output depends on the versions of ruff and docformatter, so they are
# pinned for every repository that formats with a given krrood release to format alike.
development-tools = [
    "ruff==0.17.2",
    "docformatter==1.7.8",
    "tqdm",
    "packaging",
]

[project.scripts]
krrood = "krrood.development_tools.command_line:CommandLine.main"

[project.urls]
Homepage = "https://cram2.github.io/cognitive_robot_abstract_machine/krrood/intro.html"
"Source" = "https://github.com/cram2/cognitive_robot_abstract_machine"
"Bug Tracker" = "https://github.com/cram2/cognitive_robot_abstract_machine/issues"
"Changelog" = "https://github.com/cram2/cognitive_robot_abstract_machine/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["krrood*"]
exclude = ["test*"]

[tool.setuptools.package-data]
krrood = [
  "ormatic/templates/*.j2",
  "ormatic/templates/*.jinja",
  "rustworkx_utils/visualization/templates/*.jinja",
  "code_generation/templates/*.jinja",
  "entity_query_language/testing/templates/*.jinja",
  "development_tools/agents/templates/*.jinja",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = []

[tool.coverage.run]
source = ["src/krrood"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Core is everything a plain `pip install krrood` needs. Its modules are the source modules of
# the contract below, and the packages they may load are core's dependencies further down.
[tool.importlinter]
root_package = "krrood"

[[tool.importlinter.contracts]]
id = "core-imports-no-all-module"
name = "Core imports no module of the all extra"
type = "forbidden"
source_modules = [
    "krrood._version",
    "krrood.adapters",
    "krrood.bounds",
    "krrood.class_diagrams",
    "krrood.entity_query_language",
    "krrood.exceptions",
    "krrood.inheritance_path_length",
    "krrood.patterns",
    "krrood.rustworkx_utils.graph_visualizer",
    "krrood.rustworkx_utils.graph_visualizer_base",
    "krrood.rustworkx_utils.rxnode",
    "krrood.rustworkx_utils.utils",
    "krrood.singleton",
    "krrood.symbol_graph",
    "krrood.utils",
]
forbidden_modules = [
    "krrood.code_generation",
    "krrood.development_tools",
    "krrood.ontomatic",
    "krrood.ormatic",
    "krrood.parametrization",
    "krrood.ripple_down_rules",
    "krrood.rustworkx_utils.visualization",
    "krrood.symbolic_math",
]
# Today's imports from core into krrood[all]. Entries are only ever removed.
ignore_imports = [
    "krrood.adapters.json_serializer -> krrood.ormatic.data_access_objects.base",
    "krrood.class_diagrams.attribute_introspector -> krrood.ontomatic.property_descriptor",
    "krrood.class_diagrams.module_generation -> krrood.code_generation.formatting",
    "krrood.class_diagrams.wrapped_field -> krrood.ontomatic.property_descriptor.property_descriptor",
    "krrood.entity_query_language.backends -> krrood.ormatic.eql_interface",
    "krrood.entity_query_language.backends -> krrood.parametrization.exceptions",
    "krrood.entity_query_language.backends -> krrood.parametrization.model_registries",
    "krrood.entity_query_language.backends -> krrood.parametrization.parameterizer",
    "krrood.entity_query_language.operators.probabilistic_queries -> krrood.parametrization.exceptions",
    "krrood.entity_query_language.operators.probabilistic_queries -> krrood.parametrization.model_registries",
    "krrood.entity_query_language.operators.probabilistic_queries -> krrood.parametrization.parameterizer",
    "krrood.entity_query_language.operators.probabilistic_queries -> krrood.parametrization.random_events_translator",
    "krrood.entity_query_language.orm.model -> krrood.ormatic.data_access_objects.alternative_mappings",
    "krrood.entity_query_language.testing.result_generation -> krrood.code_generation.formatting",
    "krrood.entity_query_language.testing.result_generation -> krrood.code_generation.generator",
    "krrood.entity_query_language.testing.result_generation -> krrood.code_generation.imports",
    "krrood.entity_query_language.testing.result_generation -> krrood.code_generation.type_hints",
    "krrood.entity_query_language.testing.result_verification -> krrood.ormatic.utils",
    "krrood.symbol_graph.helpers -> krrood.symbolic_math.symbolic_math",
    "krrood.symbol_graph.symbol_graph -> krrood.ontomatic.property_descriptor.attribute_introspector",
]

[tool.krrood.core-boundary]
# The import-linter contract whose source modules are core.
core-contract = "core-imports-no-all-module"
# The distributions core may load, with everything they require.
dependencies = [
    "typing-extensions",
    "rustworkx",
    "numpy",
    "ordered-set",
    "sortedcontainers",
