[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[project]
name = "krrood"
version = "26.11.0"
dependencies = [
    "krrood-core==26.11.0",
    "krrood-serialization==26.11.0",
    "krrood-code-generation==26.11.0",
    "krrood-symbolic-math==26.11.0",
    "krrood-rustworkx-utils==26.11.0",
    "krrood-eql==26.11.0",
    "krrood-planning==26.11.0",
    "krrood-ormatic==26.11.0",
    "krrood-probabilistic==26.11.0",
    "krrood-rdr==26.11.0",
    "krrood-ontomatic==26.11.0",
    "krrood-development-tools==26.11.0",
    # Installed by krrood before it was split; no krrood module imports them.
    "black",
    "owlrl",
    "pygraphviz>=1.7",
    "pyparsing>=3.2.3",
    "ucimlrepo>=0.0.7",
    "pdbpp",
    "pydot",
    "graphviz",
]
description = "A python package for Knowledge Representation and Reasoning systems based on Object Oriented Design: every krrood-* distribution."
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
authors = [
    {name = "Abdelrhman Bassiouny", email = "abassiou@uni-bremen.de"},
    {name = "Tom Schierenbeck", email = "tom_sch@uni-bremen.de"}
]
keywords = ["Knowledge-representation", "reasoning", "ontology", "orm", "query-langauge", "database", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "mypy>=1.8",
    "matplotlib",
    "igraph",
    "pyyaml",
]
visualization = [
    "krrood-rustworkx-utils[visualization]==26.11.0",
]

[project.urls]
Homepage = "https://cram2.github.io/cognitive_robot_abstract_machine/krrood/intro.html"
"Source" = "https://github.com/cram2/cognitive_robot_abstract_machine"
"Bug Tracker" = "https://github.com/cram2/cognitive_robot_abstract_machine/issues"
"Changelog" = "https://github.com/cram2/cognitive_robot_abstract_machine/blob/main/CHANGELOG.md"

[tool.setuptools]
# The distribution ships no module: every module is in a krrood-* distribution.
packages = []

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = []

[tool.coverage.run]
source = ["krrood"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
workspace = [
    "probabilistic_model",
    "random_events",
]
