# The hooks of .pre-commit-hooks.yaml, run from krrood's development tools in this
# repository's development environment (`uv sync --extra dev` installs them), so a change
# to them applies here before it is released.
repos:
  - repo: local
    hooks:
      - id: krrood-format
        name: Format Python (ruff, then docformatter where it doesn't conflict with ruff)
        entry: krrood format
        language: system
        types: [python]
        exclude: (?x)^(.*/ormatic_interface\.py|test/krrood_test/test_development_tools/dataset/.*)$
      - id: krrood-agents-md
        name: Update the rules in AGENTS.md
        entry: krrood agents-md
        language: system
        pass_filenames: false
        always_run: true
      - id: krrood-check
        name: Check the staged code against the rules that have a checker
        entry: krrood check
        language: system
        types: [python]
        files: ^krrood/src/krrood/
      - id: sync-version
        name: Sync VERSION into every package and its workspace dependency bounds
        entry: python scripts/sync_version.py
        language: system
        pass_filenames: false
        always_run: true
