[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[project]
name = "probabilistic_model"
authors = [
    { name="Tom Schierenbeck", email="tom_sch@uni-bremen.de" },

]
description = "Models for probabilistic reasoning"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords=["probabilistic models", "probabilistic machine learning", "probability theory", "variables",
    "reasoning under uncertainty"]
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "random-events>=26.10.0",
    "krrood_compute_resources>=26.10.0",
    "networkx",
    "plotly",
    "scipy>=1.10",
    "typing_extensions",
    "numpy",
    "sortedcontainers",
    "anytree>=2.8.0",
    "tqdm",
    "tabulate",
    "N2G",
    "python-igraph",
    "rustworkx>=0.16.0",
    "scikit-learn>=1.7",
    "stepmix>=3.0.0",
    "mlflow>=2.22.0",
    "pyjpt; sys_platform == 'linux'",
    "mlflow-skinny>=2.22.0",
    "dnutils",
    "arff",
    "deprecated",
    "PySide6",
    "qt-material",
    "superqt",
    "krrood-core>=26.10.0",
    "krrood-serialization>=26.10.0",
    "krrood-eql>=26.10.0",
    "krrood-ormatic>=26.10.0",
    "krrood-probabilistic>=26.10.0",
    "causal-learn",
    "array-api-compat>=1.15",
    "array-api-extra>=0.11",
]

[project.urls]
"Source" = 'https://github.com/cram2/cognitive_robot_abstract_machine'
"Bug Tracker" = 'https://github.com/cram2/cognitive_robot_abstract_machine/issues'
"Changelog" = "https://github.com/cram2/cognitive_robot_abstract_machine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["probabilistic_model*"]

[tool.setuptools.dynamic]
version = {attr = "probabilistic_model._version.__version__"}

[project.optional-dependencies]
jax = [
    "jax>=0.6.0",
    "optax>=0.2.4",
    "krrood_compute_resources[jax]>=26.10.0",
]
torch = [
    "torch>=2.4",
]
dev = [
    "pytest",
    "pandas>=2.2.3",
    "graphviz",
    "matplotlib>=3.10.1",
    "random_events>=5.0.1",
    "typing_extensions>=4.13.2",
    "pytest-qt",
    "pytest-xvfb",
]

[tool.krrood.core-boundary]
# The modules a plain `pip install probabilistic_model` must be able to load; training
# with jax and with torch needs the extras of the same name.
core = [
    "probabilistic_model._version",
    "probabilistic_model.adapters",
    "probabilistic_model.bayesian_network",
    "probabilistic_model.causal_structure",
    "probabilistic_model.constants",
    "probabilistic_model.distributions",
    "probabilistic_model.exceptions",
    "probabilistic_model.graph",
    "probabilistic_model.gui",
    "probabilistic_model.interfaces",
    "probabilistic_model.learning.circuit_parameter_learning",
    "probabilistic_model.learning.exceptions",
    "probabilistic_model.learning.expectation_maximization",
    "probabilistic_model.learning.gaussian_mixture",
    "probabilistic_model.learning.gradient_descent",
    "probabilistic_model.learning.jpt",
    "probabilistic_model.learning.learning_method",
    "probabilistic_model.learning.nyga_induction",
    "probabilistic_model.learning.progressive",
    "probabilistic_model.learning.region_graph",
    "probabilistic_model.learning.step_memory",
    "probabilistic_model.learning.training_schedule",
    "probabilistic_model.monte_carlo_estimator",
    "probabilistic_model.probabilistic_circuit",
    "probabilistic_model.probabilistic_model",
    "probabilistic_model.query_results",
    "probabilistic_model.utils",
]
dependencies = [
    "random-events",
    "krrood-compute-resources",
    "networkx",
    "plotly",
    "scipy",
    "typing-extensions",
    "numpy",
    "sortedcontainers",
    "anytree",
    "tqdm",
    "tabulate",
    "n2g",
    "python-igraph",
    "rustworkx",
    "scikit-learn",
    "stepmix",
    "mlflow",
    "pyjpt",
    "mlflow-skinny",
    "dnutils",
    "arff",
    "deprecated",
    "pyside6",
    "qt-material",
    "superqt",
    "krrood-core",
    "krrood-serialization",
    "krrood-eql",
    "krrood-ormatic",
    "krrood-probabilistic",
    "causal-learn",
    "array-api-compat",
    "array-api-extra",
]

[dependency-groups]
workspace = [
    "krrood-core",
    "krrood-serialization",
    "krrood-eql",
    "krrood-ormatic",
    "krrood-probabilistic",
    "krrood_compute_resources",
]
