<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 300" role="img" aria-label="Three cases: for a statement in a parallel beside an allowance, the outer parallel is the remainder root; for a statement inside an action the statement itself is; for a statement outside any parallel the statement itself is.">
<style>
.background { fill: #ffffff; }
.box { fill: #ffffff; stroke: #98a5ac; stroke-width: 1.2; }
.choose { fill: #ffffff; stroke: #17212a; stroke-width: 1.6; }
.start { fill: #d7eeef; stroke: #0e7882; stroke-width: 1.6; }
.later { fill: #ffffff; stroke: #0e7882; stroke-width: 1.3; stroke-dasharray: 5 3; }
.ok { fill: #dcf0e2; stroke: #2c8448; stroke-width: 1.4; }
.fail { fill: #f8e1dc; stroke: #bf3f2b; stroke-width: 1.4; }
.run { fill: #dde8f7; stroke: #2d69b8; stroke-width: 1.4; }
.wait { fill: #f6ead3; stroke: #a86d12; stroke-width: 1.6; }
.ghost { fill: none; stroke: #98a5ac; stroke-width: 1.2; stroke-dasharray: 4 3; }
.gap { fill: #f8e1dc; stroke: #bf3f2b; stroke-width: 1.4; stroke-dasharray: 5 3; }
.trialbox { fill: #efebfa; stroke: #6b4fc0; stroke-width: 1.4; }
.zone { fill: #efebfa; stroke: #6b4fc0; stroke-width: 1; stroke-dasharray: 6 4; opacity: 0.9; }
.template { fill: none; stroke: #98a5ac; stroke-width: 1.2; stroke-dasharray: 6 4; }
.rootmark { fill: none; stroke: #0e7882; stroke-width: 1.4; stroke-dasharray: 6 4; }
.root { fill: #d7eeef; stroke: #0e7882; stroke-width: 2.2; }
.edge { stroke: #98a5ac; stroke-width: 1.2; fill: none; }
.flow { stroke: #17212a; stroke-width: 1.4; fill: none; }
.flow-bad { stroke: #bf3f2b; stroke-width: 1.4; fill: none; }
.flow-accent { stroke: #0e7882; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
.marker-line { stroke: #5b6971; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.head { fill: #17212a; }
.head-bad { fill: #bf3f2b; }
text { fill: #17212a; }
.h { font: 600 14px "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; }
.t { font: 500 12px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
.tn { font: 500 11px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
.s { font: 11px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5b6971; }
.lab { font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212a; }
.lab-bad { font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #bf3f2b; }
.lab-accent { font: 500 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0e7882; }
.lab-trial { font: 600 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b4fc0; }
.num { font: 600 13px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
.gridcell { fill: #ffffff; stroke: #98a5ac; stroke-width: 1; }
</style>
<rect class="background" x="0" y="0" width="1044" height="300"/>
        <text class="h" x="125" y="24" text-anchor="middle">Inside a parallel</text>
        <text class="h" x="475" y="24" text-anchor="middle">Inside an action</text>
        <text class="h" x="805" y="24" text-anchor="middle">Outside any parallel</text>

        <line class="edge" x1="125" y1="70" x2="125" y2="208"/>
        <line class="edge" x1="125" y1="238" x2="125" y2="250"/>
        <rect class="root" x="40" y="40" width="170" height="30" rx="6"/>
        <text class="tn" x="125" y="59" text-anchor="middle">Parallel</text>
        <text class="lab-accent" x="218" y="59">← remainder root</text>
        <text class="s" x="218" y="77">holds the allowance too</text>
        <rect class="box" x="40" y="208" width="170" height="30" rx="6"/>
        <text class="tn" x="125" y="227" text-anchor="middle">Sequence</text>
        <rect class="wait" x="40" y="250" width="170" height="30" rx="6"/>
        <text class="tn" x="125" y="269" text-anchor="middle">a(OpenAction)</text>

        <line class="edge" x1="475" y1="196" x2="475" y2="208"/>
        <line class="edge" x1="475" y1="238" x2="475" y2="250"/>
        <rect class="ghost" x="390" y="166" width="170" height="30" rx="6"/>
        <text class="tn" x="475" y="185" text-anchor="middle" opacity="0.6">Parallel</text>
        <text class="s" x="568" y="185">beyond the action</text>
        <rect class="box" x="390" y="208" width="170" height="30" rx="6"/>
        <text class="tn" x="475" y="227" text-anchor="middle">TransportAction</text>
        <text class="s" x="568" y="227">action: search stops</text>
        <rect class="root" x="390" y="250" width="170" height="30" rx="6"/>
        <text class="tn" x="475" y="269" text-anchor="middle">a(PickUpAction)</text>
        <text class="lab-accent" x="568" y="269">← remainder root</text>

        <line class="edge" x1="805" y1="238" x2="805" y2="250"/>
        <rect class="box" x="720" y="208" width="170" height="30" rx="6"/>
        <text class="tn" x="805" y="227" text-anchor="middle">Sequence</text>
        <rect class="root" x="720" y="250" width="170" height="30" rx="6"/>
        <text class="tn" x="805" y="269" text-anchor="middle">a(PickUpAction)</text>
        <text class="lab-accent" x="898" y="269">← remainder root</text>
      </svg>
