<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 230" role="img" aria-label="A statement with a candidate becomes the candidate's steps in a trial, and a StatementNode handed the candidate in the real run, which is rewritten, watched by a Stalled monitor, and can ground anew from the ranking it came from.">
<style>
.background { fill: #ffffff; }
.box { fill: #ffffff; stroke: #98a5ac; stroke-width: 1.2; }
.choose { fill: #ffffff; stroke: #17212a; stroke-width: 1.6; }
.start { fill: #d7eeef; stroke: #0e7882; stroke-width: 1.6; }
.later { fill: #ffffff; stroke: #0e7882; stroke-width: 1.3; stroke-dasharray: 5 3; }
.ok { fill: #dcf0e2; stroke: #2c8448; stroke-width: 1.4; }
.fail { fill: #f8e1dc; stroke: #bf3f2b; stroke-width: 1.4; }
.run { fill: #dde8f7; stroke: #2d69b8; stroke-width: 1.4; }
.wait { fill: #f6ead3; stroke: #a86d12; stroke-width: 1.6; }
.ghost { fill: none; stroke: #98a5ac; stroke-width: 1.2; stroke-dasharray: 4 3; }
.gap { fill: #f8e1dc; stroke: #bf3f2b; stroke-width: 1.4; stroke-dasharray: 5 3; }
.trialbox { fill: #efebfa; stroke: #6b4fc0; stroke-width: 1.4; }
.zone { fill: #efebfa; stroke: #6b4fc0; stroke-width: 1; stroke-dasharray: 6 4; opacity: 0.9; }
.template { fill: none; stroke: #98a5ac; stroke-width: 1.2; stroke-dasharray: 6 4; }
.rootmark { fill: none; stroke: #0e7882; stroke-width: 1.4; stroke-dasharray: 6 4; }
.root { fill: #d7eeef; stroke: #0e7882; stroke-width: 2.2; }
.edge { stroke: #98a5ac; stroke-width: 1.2; fill: none; }
.flow { stroke: #17212a; stroke-width: 1.4; fill: none; }
.flow-bad { stroke: #bf3f2b; stroke-width: 1.4; fill: none; }
.flow-accent { stroke: #0e7882; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
.marker-line { stroke: #5b6971; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.head { fill: #17212a; }
.head-bad { fill: #bf3f2b; }
text { fill: #17212a; }
.h { font: 600 14px "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; }
.t { font: 500 12px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
.tn { font: 500 11px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
.s { font: 11px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5b6971; }
.lab { font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17212a; }
.lab-bad { font: 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #bf3f2b; }
.lab-accent { font: 500 11.5px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0e7882; }
.lab-trial { font: 600 12px "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b4fc0; }
.num { font: 600 13px "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
.gridcell { fill: #ffffff; stroke: #98a5ac; stroke-width: 1; }
</style>
<rect class="background" x="0" y="0" width="1044" height="230"/>
        <defs>
          <marker id="f5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
        </defs>
        <rect class="start" x="20" y="86" width="200" height="52" rx="6"/>
        <text class="t" x="120" y="108" text-anchor="middle">a(OpenAction)</text>
        <text class="s" x="120" y="126" text-anchor="middle">with candidate OpenAction#7</text>

        <path class="flow" d="M 220 100 C 290 100, 290 52, 364 52" marker-end="url(#f5-arrow)"/>
        <text class="tn" x="290" y="38" text-anchor="middle">build_for_trial(copy)</text>
        <rect class="trialbox" x="368" y="26" width="210" height="52" rx="6"/>
        <text class="t" x="473" y="48" text-anchor="middle">OpenAction#7/steps</text>
        <text class="s" x="473" y="66" text-anchor="middle">a failure fails the trial</text>
        <text class="s" x="596" y="46">no StatementNode, so it cannot ground anew</text>
        <text class="s" x="596" y="62">statements inside the candidate still ground</text>

        <path class="flow" d="M 220 124 C 290 124, 290 172, 364 172" marker-end="url(#f5-arrow)"/>
        <text class="tn" x="290" y="202" text-anchor="middle">build(real world)</text>
        <rect class="choose" x="368" y="146" width="170" height="52" rx="6"/>
        <text class="t" x="453" y="168" text-anchor="middle">StatementNode</text>
        <text class="s" x="453" y="186" text-anchor="middle">via CandidateHandOver</text>
        <line class="flow" x1="538" y1="172" x2="574" y2="172" marker-end="url(#f5-arrow)"/>
        <rect class="run" x="576" y="146" width="190" height="52" rx="6"/>
        <text class="t" x="671" y="168" text-anchor="middle">OpenAction#7/steps</text>
        <text class="s" x="671" y="186" text-anchor="middle">rewritten by the plan</text>
        <line class="flow-accent" x1="766" y1="172" x2="790" y2="172"/>
        <rect class="box" x="790" y="152" width="100" height="40" rx="6"/>
        <text class="t" x="840" y="176" text-anchor="middle">Stalled</text>
        <text class="s" x="906" y="160">if it fails, the statement</text>
        <text class="s" x="906" y="176">grounds anew, going on</text>
        <text class="s" x="906" y="192">from the parallel's ranking</text>
      </svg>
