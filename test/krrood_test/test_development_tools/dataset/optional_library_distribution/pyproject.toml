# A distribution whose core may not import matplotlib at module level, read by the
# optional-library checker's tests.
[project]
name = "mimic-distribution"
version = "0.0.0"
dependencies = ["typing-extensions"]

[project.optional-dependencies]
drawing = ["matplotlib", "typing-extensions"]

[[tool.importlinter.contracts]]
id = "core-imports-no-drawing"
name = "Core imports no drawing module"
type = "forbidden"
source_modules = ["mimic_package.core"]
forbidden_modules = ["mimic_package.drawing"]

[tool.krrood.core-boundary]
core-contract = "core-imports-no-drawing"
