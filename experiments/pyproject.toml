[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
description = "Experiment scripts and actions for CRAM."
requires-python = ">=3.10"
license = "LGPL-3.0-only"
dynamic = ["version"]
dependencies = [
    "line_profiler",
    "coraplex>=26.10.0",
    "cramph>=26.10.0",
    "giskardpy>=26.10.0",
    "krrood>=26.10.0",
    "probabilistic_model>=26.10.0",
    "pymysql",
    "random_events>=26.10.0",
    "semantic_digital_twin>=26.10.0",
    "krrood_spatial_math[casadi]>=26.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "experiments._version.__version__"}

[dependency-groups]
workspace = [
    "coraplex",
    "cramph",
    "giskardpy",
    "krrood",
    "krrood_spatial_math",
    "random_events",
    "semantic_digital_twin",
]
