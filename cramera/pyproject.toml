[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cramera"
authors = [
    { name = "Vanessa Hassouna", email = "hassouna@uni-bremen.de" },
]
description = "Browser-based visualization for the CRAM architecture: 3D scene, EQL knowledge panel and execution graphs as swappable panels."
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
keywords = ["robotics", "visualization"]
dynamic = ["version"]
dependencies = [
    "coraplex", "giskardpy", "semantic_digital_twin", "krrood", "segmind",
    "numpy", "scipy", "rapidfuzz>=3.0", "typing_extensions", "urdf-parser-py",
]
license = { text = "GPL-3.0-only" }

[project.urls]
"Source" = 'https://github.com/cram2/cognitive_robot_abstract_machine'

[project.scripts]
cramera = "cramera.server:main"
cramera-live = "cramera.live.runner:main"

[project.entry-points."coraplex.visualizations"]
cramera = "cramera.live.visualization:LiveVisualization"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cramera*"]

[tool.setuptools.package-data]
# the web frontend ships with the package (all local assets, no CDN)
cramera = ["web/**/*"]

[tool.setuptools.dynamic]
version = { attr = "cramera._version.__version__" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
]
