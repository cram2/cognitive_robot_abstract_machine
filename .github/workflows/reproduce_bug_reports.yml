name: Reproduce bug reports
defaults:
  run:
    shell: bash -ieo pipefail {0}

# Runs the script of a bug report on main and comments on the issue with what it did.
# The script is its author's code, so the job running it gets a read-only token and no
# secrets; the report job, which never runs it, is the only one that may comment.
on:
  issues:
    types: [opened, edited, labeled]

permissions: {}

# an edit while the script still runs replaces that run, so the comment shows the last edit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  to-lowercase:
    # The heading is the label of BugReportIssueForm.code_example, which krrood ships.
    # Authors whose pull requests run CI without approval under the repository's
    # "first_time_contributors" policy start it; anyone else's waits for the reproduce label.
    if: >-
      contains(github.event.issue.body, '### Reproduce the code example') && (
        github.event.action == 'labeled' && github.event.label.name == 'reproduce'
        || github.event.action != 'labeled' && (
          contains(github.event.issue.labels.*.name, 'reproduce')
          || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'),
                      github.event.issue.author_association)))
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> "$GITHUB_OUTPUT"

  reproduce:
    needs: [to-lowercase]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: ${{ needs.to-lowercase.outputs.repo_lowercase }}
      options: --volume /:/host
    env:
      # see ci_reusable.yml: the CPU only PyTorch index keeps the runner disk from filling up
      UV_INDEX: https://download.pytorch.org/whl/cpu
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - uses: actions/checkout@v4
        with:
          path: cognitive_robot_abstract_machine
          submodules: recursive
          persist-credentials: false

      - name: Free disk space
        run: cognitive_robot_abstract_machine/scripts/free_runner_disk.sh

      - name: Install dependencies
        uses: ./cognitive_robot_abstract_machine/.github/actions/install-workspace

      - name: Take the script from the issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          source /opt/ros/cram-env/bin/activate
          mkdir -p "$GITHUB_WORKSPACE/reproduction/script"
          echo "$GITHUB_SHA" > "$GITHUB_WORKSPACE/reproduction/commit"
          cd cognitive_robot_abstract_machine
          if ! printf '%s' "$ISSUE_BODY" | krrood issue-answer --form bug-report \
              --field reproduce-the-code-example > "$GITHUB_WORKSPACE/reproduction/script/reproduce.py"; then
            echo unanswered > "$GITHUB_WORKSPACE/reproduction/exit_status"
          fi

      - name: Run the script
        run: |
          if [ -f "$GITHUB_WORKSPACE/reproduction/exit_status" ]; then exit 0; fi
          source /opt/ros/cram-env/bin/activate
          source /opt/ros/overlay_ws/install/setup.bash
          # a script may persist objects, which needs the generated ORM interfaces
          python cognitive_robot_abstract_machine/scripts/regenerate_all_orm.py
          cd "$GITHUB_WORKSPACE/reproduction/script"
          exit_status=0
          timeout 600 python reproduce.py > ../output 2>&1 || exit_status=$?
          echo "$exit_status" > ../exit_status

      - uses: actions/upload-artifact@v4
        with:
          name: reproduction
          path: |
            reproduction/commit
            reproduction/exit_status
            reproduction/output
          if-no-files-found: ignore

  report:
    needs: [reproduce]
    if: always() && needs.reproduce.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reproduction
          path: reproduction

      # the files are the script's results, read as data and never run
      - name: Comment on the issue with the result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          commit="$(cat reproduction/commit)"
          exit_status="$(cat reproduction/exit_status)"
          case "$exit_status" in
            unanswered) outcome="could not be read: put the script in a Python code block under *Reproduce the code example*." ;;
            0) outcome="finishes without an error. If the bug shows in the output rather than as an error, check the output below." ;;
            124) outcome="did not finish within 10 minutes." ;;
            *) outcome="fails with exit status $exit_status." ;;
          esac
          {
            echo "On main at \`$commit\`, the script under *Reproduce the code example* $outcome"
            if [ -f reproduction/output ]; then
              echo
              echo "<details><summary>Output, last 100 lines</summary>"
              echo
              echo "~~~~text"
              tail -n 100 reproduction/output
              echo "~~~~"
              echo "</details>"
            fi
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file comment.md --edit-last --create-if-none
