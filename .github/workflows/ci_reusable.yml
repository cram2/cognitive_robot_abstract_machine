name: CI reusable
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  workflow_call:
    inputs:
      lib:
        description: "Library folder name (relative to repo root)"
        required: true
        type: string
      repo_lowercase:
        description: "Lowercase repository name with tag"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    # Fails a job that is still running after an hour. A runner that runs out of disk or memory
    # stops responding, and its job would otherwise only end at GitHub's six-hour limit.
    timeout-minutes: 60
    container:
      image: ${{ inputs.repo_lowercase }}
      # The host's root, so free_runner_disk.sh can delete what the runner image installs and
      # show_runner_resources.sh can measure the disk the job shares with it. Writable, since
      # the runner's machine is discarded after the job.
      options: --volume /:/host
    env:
      # The tests never run on a GPU, so torch (pulled in through robokudo -> ultralytics) is
      # installed from the CPU only PyTorch index. The CUDA build from PyPI adds several GB of
      # nvidia wheels and exhausts the runner disk ("No space left on device").
      # unsafe-best-match lets every other package still come from PyPI, since the PyTorch index
      # also mirrors outdated versions of common packages such as packaging.
      UV_INDEX: https://download.pytorch.org/whl/cpu
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - uses: actions/checkout@v4
        with:
          path: cognitive_robot_abstract_machine
          submodules: recursive

      - name: Free disk space
        run: cognitive_robot_abstract_machine/scripts/free_runner_disk.sh

      - name: Show runner resources
        run: cognitive_robot_abstract_machine/scripts/show_runner_resources.sh

      - name: Install dependencies
        env:
          # Keep the cache on the venv filesystem so uv can hardlink installed wheels.
          UV_CACHE_DIR: /opt/ros/.uv_cache
          CI_LIBRARY: ${{ inputs.lib }}
        run: |
          cd cognitive_robot_abstract_machine
          source /opt/ros/cram-env/bin/activate
          optional_packages=
          case "$CI_LIBRARY" in
            robokudo|semantic_digital_twin) optional_packages="$CI_LIBRARY" ;;
          esac
          bash scripts/install_dependencies.sh cpu "$optional_packages"

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cache/semantic_digital_twin
          key: ${{ runner.os }}-cache-${{ inputs.lib }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cache-${{ inputs.lib }}-${{ github.ref_name }}
            ${{ runner.os }}-cache-${{ inputs.lib }}
            ${{ runner.os }}-cache-

      - name: Run CPP tests
        if: ${{inputs.lib == 'random_events'}}
        run: |
          cd cognitive_robot_abstract_machine/${{ inputs.lib }}/src/random_events_lib
          sudo apt-get install -y g++ unzip zip
          BAZEL_VERSION=7.0.0
          curl -L -o bazel.sh \
            https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-installer-linux-x86_64.sh
          chmod +x bazel.sh
          ./bazel.sh --user
          export PATH="$HOME/bin:$PATH"
          
          bazel build //test:test_all
          bazel test //test:test_all

      - name: Check the generated rules in AGENTS.md
        # AGENTS.md is generated from the rules krrood ships and agent_rules.py; a hand
        # edit or a forgotten regeneration fails here.
        if: ${{ inputs.lib == 'krrood' }}
        run: |
          source /opt/ros/cram-env/bin/activate
          cd cognitive_robot_abstract_machine
          krrood agents-md --check

      - name: Run tests
        run: |
          source /opt/ros/cram-env/bin/activate
          source /opt/ros/overlay_ws/install/setup.bash
          echo "PYTHONPATH: $PYTHONPATH"
          if [[ "${{ inputs.lib }}" == "probabilistic_model" ]]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          # The MuJoCo video-recorder tests render offscreen; xvfb provides a display, so MuJoCo
          # would otherwise pick its windowed GLFW backend and fail to create a context on the
          # runner. EGL renders headlessly. Must be set before Python imports mujoco, which locks
          # the GL backend at import, so it cannot be done from inside the test process.
          if [[ "${{ inputs.lib }}" == "semantic_digital_twin" ]]; then
            export MUJOCO_GL=egl
          fi
          if [[ "${{ inputs.lib }}" == "cramployer" ]]; then
            free -m
            ulimit -v 6291456
            cd cognitive_robot_abstract_machine
            python -m pytest --orm-build never --cov=scripts.cramployer --cov-config=scripts/cramployer/coverage.ini --cov-fail-under=85 test/cramployer_test scripts/cramployer/container_tests
          else
            python -m pytest -n auto cognitive_robot_abstract_machine/test/${{ inputs.lib }}_test
          fi

      - name: Show runner resources after the job
        # Runs after a failure too, so a job that ran out of disk shows what filled it.
        if: always()
        run: cognitive_robot_abstract_machine/scripts/show_runner_resources.sh

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /github/home/.cache/semantic_digital_twin
          key: ${{ runner.os }}-cache-${{ inputs.lib }}-${{ github.ref_name }}-${{ github.run_id }}
