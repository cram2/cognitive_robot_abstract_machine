name: Label pull requests by changed files

# pull_request_target instead of pull_request: a pull request from a fork only gets a read-only
# token under pull_request. This stays safe because the job never checks out or runs the pull
# request's code; the labeler reads the changed files through the API and .github/labeler.yml
# from the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # sync-labels stays false, so labels set by hand are never removed
      - uses: actions/labeler@v7
