name: CI (matrix over libs)
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  push:
    branches:
    - main
  pull_request:
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  to-lowercase:
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  test_each_lib:
    needs: [to-lowercase]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lib: giskardpy
          - lib: krrood
          - lib: semantic_digital_twin
          - lib: coraplex
          - lib: random_events
          - lib: probabilistic_model
          - lib: physics_simulators
          - lib: robokudo
          - lib: segmind
          - lib: experiments
          - lib: version
          - lib: cognitive_robot_abstract_machine
    uses: ./.github/workflows/ci_reusable.yml
    with:
      lib: ${{ matrix.lib }}
      repo_lowercase: ${{ needs.to-lowercase.outputs.repo_lowercase }}

  check_generated_orm_interfaces_are_untracked:
    # ormatic_interface.py files are generated by ORMatic and never reviewed, so the repo
    # ignores them (see the rule in .gitignore) and builds them when a checkout needs them.
    # Tracking one brings back the branch switches that fail on a locally generated copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tracked=$(git ls-files -- '*/ormatic_interface.py')
          if [ -n "$tracked" ]; then
            echo "These generated ORM interface files must not be tracked:"
            echo "$tracked"
            echo "Untrack them with 'git rm --cached', and build them locally with scripts/regenerate_all_orm.py."
            exit 1
          fi

  test_claude_dev_tooling:
    # The .claude/ agent-tooling scripts (e.g. the plan-dashboard skill) are
    # plain, dependency-light Python - they don't need the heavy docker-based
    # matrix above, which is scoped to the robotics packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          pip install pytest -r "${PLAN_DASHBOARD_REQUIREMENTS_FILE}"
      - run: |
          source .claude/hooks/resolve-personal-notes-config.sh
          python -m pytest "${PLAN_DASHBOARD_TESTS_DIRECTORY}" "${HOOKS_TESTS_DIRECTORY}" \
            "${STACK_TESTS_DIRECTORY}" "${ADD_PLAN_ITEM_TESTS_DIRECTORY}"
