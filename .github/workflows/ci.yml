name: CI (matrix over libs)
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  push:
    branches:
    - main
  pull_request:
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

# a new push to a pull request cancels the run still going for its previous commit, so
# the runners only ever test the commit that can still be merged
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  to-lowercase:
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  changes:
    # a pull request tests only the libraries its changes can affect; every other event,
    # a push to main included, tests all of them, so a dependency the selection misses
    # still fails on main
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.select.outputs.libs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: select
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # HEAD^1 is the base side of the pull request's merge commit; without rename
            # detection a moved file lists both its old and its new path
            libs=$(git diff --name-only --no-renames HEAD^1 HEAD | python scripts/affected_ci_libraries.py)
          else
            libs=$(python scripts/affected_ci_libraries.py --all)
          fi
          echo "libs=$libs" >> "$GITHUB_OUTPUT"

  test_each_lib:
    needs: [to-lowercase, changes]
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJSON(needs.changes.outputs.libs) }}
    uses: ./.github/workflows/ci_reusable.yml
    with:
      lib: ${{ matrix.lib }}
      repo_lowercase: ${{ needs.to-lowercase.outputs.repo_lowercase }}

  check_generated_orm_interfaces_are_untracked:
    # ormatic_interface.py files are generated by ORMatic and never reviewed, so the repo
    # ignores them (see the rule in .gitignore) and builds them when a checkout needs them.
    # Tracking one brings back the branch switches that fail on a locally generated copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tracked=$(git ls-files -- '*/ormatic_interface.py')
          if [ -n "$tracked" ]; then
            echo "These generated ORM interface files must not be tracked:"
            echo "$tracked"
            echo "Untrack them with 'git rm --cached', and build them locally with scripts/regenerate_all_orm.py."
            exit 1
          fi

  ci_result:
    # the one check branch protection can require, since a library a pull request does
    # not test never reports a check of its own
    needs: [to-lowercase, changes, test_each_lib, check_generated_orm_interfaces_are_untracked]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "A job this result depends on failed, was cancelled or was skipped."
            exit 1
          fi
