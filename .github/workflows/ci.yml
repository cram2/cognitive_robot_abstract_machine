name: CI (matrix over libs)
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  push:
    branches:
    - main
  pull_request:
    # ready_for_review runs the jobs a draft pull request skipped
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

# a new push to a pull request cancels the run still going for its previous commit, so
# the runners only ever test the commit that can still be merged
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  to-lowercase:
    # a draft pull request runs no CI; marking it ready for review starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  select_test_jobs:
    # a draft pull request runs no CI; marking it ready for review starts the run
    if: ${{ !github.event.pull_request.draft }}
    # A pull request runs only the tests its change can affect; every other event runs them
    # all. The libraries that share a job are listed in .github/ci_jobs.toml.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its merge commit, whose first parent is the base.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install what the selection imports
        run: pip install packaging typing_extensions
      - id: select
        name: Select the test jobs
        env:
          # krrood-core loads without the rest of krrood, so the job needs no install of the
          # workspace.
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/krrood/krrood-core/src
        run: |
          since=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            since=(--since HEAD^1)
          fi
          matrix=$(python scripts/select_ci_jobs.py "${since[@]}")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test_each_lib:
    needs: [to-lowercase, select_test_jobs]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_test_jobs.outputs.matrix) }}
    uses: ./.github/workflows/ci_reusable.yml
    with:
      name: ${{ matrix.name }}
      libs: ${{ matrix.libs }}
      test_paths: ${{ matrix.test_paths }}
      repo_lowercase: ${{ needs.to-lowercase.outputs.repo_lowercase }}
      check_rules: ${{ matrix.check_rules }}

  check_generated_orm_interfaces_are_untracked:
    # a draft pull request runs no CI; marking it ready for review starts the run
    if: ${{ !github.event.pull_request.draft }}
    # ormatic_interface.py files are generated by ORMatic and never reviewed, so the repo
    # ignores them (see the rule in .gitignore) and builds them when a checkout needs them.
    # Tracking one brings back the branch switches that fail on a locally generated copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tracked=$(git ls-files -- '*/ormatic_interface.py')
          if [ -n "$tracked" ]; then
            echo "These generated ORM interface files must not be tracked:"
            echo "$tracked"
            echo "Untrack them with 'git rm --cached', and build them locally with scripts/regenerate_all_orm.py."
            exit 1
          fi
