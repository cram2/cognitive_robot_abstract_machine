name: Examples and Demos  (matrix over libs)
defaults:
  run:
    shell: bash -euo pipefail {0}

on:
  push:
    branches:
    - main
  pull_request:
    # ready_for_review runs the jobs a draft pull request skipped
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  to-lowercase:
    # a draft pull request runs no CI; marking it ready for review starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  test_each_lib:
    needs: [to-lowercase]
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: coraplex/scripts/test_notebook_examples.sh
          - script: semantic_digital_twin/scripts/test_notebook_examples.sh
          - script: semantic_digital_twin/scripts/test_exercises.sh
          - script: semantic_digital_twin/scripts/test_quizzes.sh
          - script: coraplex/demos/coraplex_bullet_world_demo/test_demo.py
          - script: coraplex/demos/coraplex_failure_handling_demo/test_demo.py
          - script: coraplex/demos/coraplex_garmi_clean_up_demo/test_demo.py
          - script: coraplex/demos/coraplex_hsr_mujoco_demo/test_demo.py
          - script: coraplex/demos/coraplex_real_tracy/test_demo.py
          - script: experiments/src/experiments/real_stretch_apartment_demo/test_demo.py
          - script: experiments/src/experiments/daisy_gripper_demo/test_demo.py
    uses: ./.github/workflows/example_demo_reusable.yml
    with:
      script: ${{ matrix.script }}
      repo_lowercase: ${{ needs.to-lowercase.outputs.repo_lowercase }}
