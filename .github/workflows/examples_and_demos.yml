name: Examples and Demos
defaults:
  run:
    shell: bash -ieo pipefail {0}

on:
  push:
    branches:
    - main
  pull_request:
    # ready_for_review runs the jobs a draft pull request skipped
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_run:
    workflows: [ "update_docker" ]
    types: [ completed ]
    branches: [ main ]

# a new push to a pull request cancels the run still going for its previous commit, so
# the runners only ever test the commit that can still be merged
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  to-lowercase:
    # a draft pull request runs no CI; marking it ready for review starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      repo_lowercase: ${{ steps.lowercase.outputs.repository }}
    steps:
      - id: lowercase
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}:jazzy" >> $GITHUB_OUTPUT

  run_examples_and_demos:
    # Every example and demo runs in this one job: each takes a few minutes, while setting
    # up the container, the workspace and the ORM takes about five.
    needs: [to-lowercase]
    runs-on: ubuntu-latest
    # Fails a job that is still running after an hour. A runner that runs out of disk or memory
    # stops responding, and its job would otherwise only end at GitHub's six-hour limit.
    timeout-minutes: 60
    container:
      image: ${{ needs.to-lowercase.outputs.repo_lowercase }}
      # The host's root, so free_runner_disk.sh can delete what the runner image installs and
      # show_runner_resources.sh can measure the disk the job shares with it. Writable, since
      # the runner's machine is discarded after the job.
      options: --volume /:/host
    env:
      # The CPU only torch build, as in ci_reusable.yml: the CUDA build exhausts the runner disk.
      UV_INDEX: https://download.pytorch.org/whl/cpu
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - uses: actions/checkout@v4
        with:
          path: cognitive_robot_abstract_machine
          submodules: recursive

      - name: Free disk space
        run: cognitive_robot_abstract_machine/scripts/free_runner_disk.sh

      - name: Show runner resources
        run: cognitive_robot_abstract_machine/scripts/show_runner_resources.sh

      - name: Install dependencies
        env:
          # Keep uv's cache on the same filesystem as the target venv (/opt/ros/cram-env) so uv can
          # hardlink packages into site-packages instead of full-copying them. The default cache
          # (~/.cache/uv under the mounted /github/home volume) is a different filesystem, which
          # forces a full copy of every wheel and stores each package twice -- exhausting the runner
          # disk ("No space left on device") during install.
          UV_CACHE_DIR: /opt/ros/.uv_cache
        run: |
          cd cognitive_robot_abstract_machine
          source /opt/ros/cram-env/bin/activate
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1
          uv sync --extra dev,doc --active

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.cache/semantic_digital_twin
          key: ${{ runner.os }}-demo-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-demo-cache-${{ github.ref_name }}-
            ${{ runner.os }}-demo-cache-

      - name: Build ORM
        # ormatic_interface.py files are not tracked (see AGENTS.md), so the full
        # dependency chain (semantic_digital_twin -> giskardpy -> segmind -> coraplex ->
        # experiments, see scripts/regenerate_all_orm.py) must be regenerated before any
        # example or demo that touches the database can run. Every script this job runs
        # lives under coraplex, semantic_digital_twin, or experiments, so this always applies.
        run: |
          cd cognitive_robot_abstract_machine
          source /opt/ros/overlay_ws/install/setup.bash
          source /opt/ros/cram-env/bin/activate
          python scripts/regenerate_all_orm.py

      - name: Run the examples and demos
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: 1
          # A script that hangs fails on its own instead of using up the job's time.
          SCRIPT_TIMEOUT: 15m
        run: |
          cd cognitive_robot_abstract_machine
          source /opt/ros/overlay_ws/install/setup.bash
          source /opt/ros/cram-env/bin/activate
          scripts=(
            coraplex/scripts/test_notebook_examples.sh
            semantic_digital_twin/scripts/test_notebook_examples.sh
            semantic_digital_twin/scripts/test_exercises.sh
            semantic_digital_twin/scripts/test_quizzes.sh
            coraplex/demos/coraplex_bullet_world_demo/test_demo.py
            coraplex/demos/coraplex_failure_handling_demo/test_demo.py
            coraplex/demos/coraplex_garmi_clean_up_demo/test_demo.py
            coraplex/demos/coraplex_hsr_mujoco_demo/test_demo.py
            coraplex/demos/coraplex_real_tracy/test_demo.py
            experiments/src/experiments/real_stretch_apartment_demo/test_demo.py
            experiments/src/experiments/daisy_gripper_demo/test_demo.py
          )
          # Every script runs, even after another one failed; the step fails at the end.
          failed=0
          {
            echo "| Script | Result | Minutes |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            started=$SECONDS
            if timeout "$SCRIPT_TIMEOUT" "./$script"; then
              result=passed
            else
              result=failed
              failed=1
            fi
            echo "::endgroup::"
            if [[ "$result" == failed ]]; then
              echo "::error title=$script::$script failed"
            fi
            minutes=$(awk "BEGIN { printf \"%.1f\", ($SECONDS - $started) / 60 }")
            echo "| \`$script\` | $result | $minutes |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      - name: Show runner resources after the job
        # Runs after a failure too, so a job that ran out of disk shows what filled it.
        if: always()
        run: cognitive_robot_abstract_machine/scripts/show_runner_resources.sh

      - name: Save cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /github/home/.cache/semantic_digital_twin
          key: ${{ runner.os }}-demo-cache-${{ github.ref_name }}-${{ github.run_id }}
