name: Publish krrood to PyPI

on:
  push:
    branches:
      - main
    paths:
      - 'krrood/**'
  workflow_dispatch:

jobs:
  check-version:
    name: Check if ${{ matrix.distribution }}'s version is new
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The krrood distribution and every krrood-* distribution it depends on, by
        # directory; all of them are released at the repository's VERSION.
        distribution: &distributions
          - krrood
          - krrood-core
          - krrood-serialization
          - krrood-code-generation
          - krrood-symbolic-math
          - krrood-rustworkx-utils
          - krrood-eql
          - krrood-planning
          - krrood-ormatic
          - krrood-probabilistic
          - krrood-rdr
          - krrood-ontomatic
          - krrood-development-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version against PyPI
        id: check
        run: |
          LOCAL_VERSION=$(cat VERSION)
          echo "Local version: $LOCAL_VERSION"

          PYPI_VERSION=$(pip index versions ${{ matrix.distribution }} 2>/dev/null \
            | grep -oP '(?<=Available versions: )[^,]+' \
            | tr -d ' ')
          PYPI_VERSION=${PYPI_VERSION:-0.0.0}
          echo "PyPI version: $PYPI_VERSION"

          python -c "
          import sys
          def parse(v):
              return tuple(int(x) for x in v.split('.'))
          sys.exit(0 if parse('$LOCAL_VERSION') > parse('$PYPI_VERSION') else 1)
          " && echo "should_publish=true" >> $GITHUB_OUTPUT \
            || echo "should_publish=false" >> $GITHUB_OUTPUT

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pip install build
          directory=krrood
          if [[ "${{ matrix.distribution }}" != "krrood" ]]; then
            directory=krrood/${{ matrix.distribution }}
          fi
          python -m build "$directory" --outdir dist/

      - name: Upload dist
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.distribution }}
          path: dist/

  publish:
    name: Publish ${{ matrix.distribution }} to PyPI
    runs-on: ubuntu-latest
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        distribution: *distributions
        exclude:
          - distribution: krrood
    # PyPI keeps a single pending trusted publisher per workflow and environment, so
    # each distribution publishes from an environment of its own.
    environment: &publish_environment
      name: pypi-${{ matrix.distribution }}
      url: https://pypi.org/p/${{ matrix.distribution }}
    permissions:
      id-token: write  # required for trusted publishing
    steps: &publish_steps
      - name: Download the dist of ${{ matrix.distribution }}
        uses: actions/download-artifact@v4
        with:
          pattern: dist-${{ matrix.distribution }}
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        if: hashFiles('dist/*') != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: 'true'

  # The krrood distribution pins every krrood-* distribution, so it is published only
  # once all of them are on PyPI; otherwise an installer falls back to an older krrood.
  publish-krrood:
    name: Publish ${{ matrix.distribution }} to PyPI
    runs-on: ubuntu-latest
    needs: [check-version, publish]
    strategy:
      matrix:
        distribution:
          - krrood
    environment: *publish_environment
    permissions:
      id-token: write  # required for trusted publishing
    steps: *publish_steps
