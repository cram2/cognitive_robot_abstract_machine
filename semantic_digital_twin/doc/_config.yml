# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Semantic Digital Twin
author: AICOR Institute for Artificial Intelligence

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  # a cell that raises fails the build instead of only logging a warning
  raise_on_error: true
  # not executed for now: the ORM interface is not generated here, the others exceed the cell timeout
  exclude_patterns:
    - "examples/persistence_of_annotated_worlds.md"
    - "examples/building_worlds_with_specifications.md"
    - "self_assessment/exercises/10_building_worlds_with_specifications.md"
    - "doc/world_reasoner.md"
    - "examples/graph_of_convex_sets.md"
    - "examples/visualizing_worlds.md"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

sphinx:
  extra_extensions:
    - myst_nb
    - sphinxcontrib.bibtex  # Add the BibTeX extension
    - autoapi.extension  # Add the AutoAPI extension
    - sphinx.ext.autodoc
    - sphinxcontrib.plantuml
  config:
    bibtex_bibfiles:
      - references.bib
    bibtex_reference_style: author_year
    bibtex_default_style: plain
    # AutoAPI configuration
    autoapi_dirs:
      - ../src
    autoapi_options:
      - members
      - undoc-members
      - show-inheritance
      - show-module-summary
    autoapi_add_toctree_entry: True
    html_static_path: ["_static"]
    html_theme_options:
      logo:
        image_light: "_static/images/semantic_world_logo.png"
        image_dark: "_static/images/semantic_world_logo_dark_mode.png"


# Information about where the book exists on the web
repository:
  url: https://github.com/cram2/semantic_digital_twin  # Online location of your book
  path_to_book: doc  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  extra_css: ["_static/custom.css"]
