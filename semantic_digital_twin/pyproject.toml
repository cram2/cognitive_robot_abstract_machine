[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[project]
name = "semantic_digital_twin"
authors = [
    { name="Tom Schierenbeck", email="tom_sch@uni-bremen.de" },

]
description = "A world model that unifies kinematic information and semantic meaning for robotic world representations."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords=["robotics"]
dynamic = ["version"]
dependencies = [
    "rustworkx",
    "nltk",
    "numpy",
    "trimesh>=4.11.1",
    "typing_extensions",
    "urdf-parser-py",
    "xacro",
    "matplotlib",
    "casadi~=3.7.0",
    "hypothesis!=6.156.6",  # 6.156.6 ships no linux-x86_64 wheel; skip it so uv sync resolves
    "scipy",
    "sqlacodegen",
    "pytest-order",
    "sqlalchemy",
    "embreex",  # Hardware acceleration for trimesh raycasting
    "rtree",  # For spatial indexing in trimesh
    "xxhash",  # Fast hashing for trimesh, which hashes meshes to check its caches
    "random_events>=26.10.0",
    "plotly",
    "daqp",
    "pathlib",
    "probabilistic_model>=26.10.0",
    "python-fcl",
    "manifold3d",
    "polytope",
    "ortools",
    "fbxloader",
    "coacd",
    "pymysql",
    "pyglet==1.5.31",
    "pycollada",
    "psycopg",
    "plyfile",
    "huggingface-hub",
    "vhacdx",
    "rerun-sdk[datafusion]",
    "imageio",
    "imageio-ffmpeg",
    "psutil~=5.9.0",
    "giskardpy>=26.10.0",
    "krrood>=26.10.0",
    "krrood_spatial_math[casadi]>=26.10.0",
    "physics_simulators>=26.10.0",
]
license = "LGPL-3.0-only"

[project.urls]
"Source" = 'https://github.com/cram2/semantic_digital_twin'
"Bug Tracker" = 'https://github.com/cram2/semantic_digital_twin/issues'
"Changelog" = "https://github.com/cram2/cognitive_robot_abstract_machine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["semantic_digital_twin*"]

[tool.setuptools.package-data]
"semantic_digital_twin.part_finding" = ["prompts/*.jinja"]
"semantic_digital_twin.shape_sorting_toy" = ["resources/*.stl"]

[project.scripts]
semantic-digital-twin-part-finding-server = "semantic_digital_twin.adapters.part_finding.command_line:PartFindingCommandLine.run"

[tool.setuptools.dynamic]
version = {attr = "semantic_digital_twin._version.__version__"}

[dependency-groups]
workspace = [
    "giskardpy",
    "krrood",
    "krrood_spatial_math",
    "physics_simulators",
    "probabilistic_model",
    "random_events",
]

[project.optional-dependencies]
gui = [
    "ripple_down_rules[gui]",
]
iris = [
    "drake",
]
vision = [
    # Install torch for your GPU's CUDA version first, see doc/part_finding.md
    "torch",
    "torchvision",
    "transformers>=4.57.1",
    "accelerate",
    "bitsandbytes",
    "pillow",
]
datasets = [
    "py7zr",
    "usd-core>=24.11",
]
dev = [
    "pytest>=7.0.0,<8.0.0",
]
self-assessment = [
    "jupyter-book",
    "jupytext",
    "nbconvert",
    "jupyterquiz",
    "treon",
]
