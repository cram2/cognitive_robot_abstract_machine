[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[project]
name = "giskardpy"
authors = [
    { name="Simon Stelter", email="stelter@uni-bremen.de" },
]
description = "A qp-based motion controller for robotic systems."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords=["robotics"]
dynamic = ["version"]
dependencies = [
    "pip>=23.2.1",
    "casadi>=3.5.5",
    "numpy",
    "scipy>=1.10.1",
    "pandas>=1.5.3",
    "matplotlib>=3.6.2",
    "trimesh>=3.20.2",
    "lxml>=4.5.0",
    "sortedcontainers>=2.4.0",
    "piqp",
    "pycollada>=0.7.2",
    "line_profiler>=4.1.3",
    "urdf-parser-py>=0.0.4",
    "giskardpy_bullet_bindings==1.0.1",
    "PyQT5>=5.15.11",
    "krrood",
    "semantic_digital_twin",
]
license = "LGPL-3.0-only"

[project.urls]
"Source" = 'https://github.com/SemRoCo/giskardpy'
"Bug Tracker" = 'https://github.com/SemRoCo/giskardpy/issues'

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["giskardpy*"]

[tool.setuptools.dynamic]
version = {attr = "giskardpy._version.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0"

]

